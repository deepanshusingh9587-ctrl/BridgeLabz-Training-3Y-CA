<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>

    <form autocomplete="off">

        <input type="text" required>

        <br>

        <input type="email" required>

        <br>

        <button type="submit">Submit</button>

    </form>

    <p>
        Turning off autocomplete can improve security by preventing saved form data from automatically appearing.
    </p>

</body>
</html>
