<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>

    <!-- loading="lazy" means the map loads only when it is needed.
         This helps improve page loading performance. -->

    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        title="Google Map"
        width="100%"
        height="400"
        loading="lazy">
    </iframe>

</body>
</html>
