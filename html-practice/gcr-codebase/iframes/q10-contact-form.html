<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>
    
    <form>

        <input
            type="text"
            placeholder="Full Name"
            required>

        <br>

        <input
            type="email"
            placeholder="Email"
            required>

        <br>

        <input
            type="text"
            placeholder="Subject"
            required>

        <br>

        <textarea
            placeholder="Message"
            required>
        </textarea>

        <br>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
