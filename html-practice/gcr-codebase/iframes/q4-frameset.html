<!DOCTYPE html>
<html>
<head>
    <title>Frameset Layout</title>
</head>

<frameset rows="30%,70%">

    <frame srcdoc="
        <html>
        <body>
            <a href='#'>Home</a> |
            <a href='#'>About</a> |
            <a href='#'>Contact</a>
        </body>
        </html>
    ">

    <frame srcdoc="
        <html>
        <body>
            <h1>Welcome to My Website</h1>
        </body>
        </html>
    ">

</frameset>

</html>
