<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
</head>
<body>
    <form method="post" action="#">

        <label>Feedback:</label>

        <br>

        <textarea rows="5" cols="30"></textarea>

        <br>

        <label>
            <input type="radio" name="rating">
            Good
        </label>

        <label>
            <input type="radio" name="rating">
            Average
        </label>

        <label>
            <input type="radio" name="rating">
            Poor
        </label>

        <br>

        <button type="submit">Submit</button>

    </form>
</body>
</html>
