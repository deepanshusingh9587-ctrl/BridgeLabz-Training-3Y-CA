<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>

    <form>

        <label>Username:</label>
        <input type="text" required>

        <br><br>

        <label>Password:</label>
        <input type="password" required>

        <input type="hidden" value="dummyCSRFtoken">

        <br><br>

        <button type="submit">Login</button>

    </form>

    <!-- CSRF token helps protect forms from unauthorized requests. -->

</body>
</html>
