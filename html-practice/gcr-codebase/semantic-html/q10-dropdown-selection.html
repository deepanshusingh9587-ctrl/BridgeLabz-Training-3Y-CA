<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Page</title>
</head>
<body>

    <h1>Travel Selection</h1>

    <form>

        <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="uk">United Kingdom</option>
            <option value="canada">Canada</option>
        </select>

        <br>

        <label for="state">State:</label>

        <select id="state" name="state">
            <option value="up" selected>Uttar Pradesh</option>
            <option value="delhi">Delhi</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="maharashtra">Maharashtra</option>
        </select>

        <br>

        <label for="city">City:</label>

        <select id="city" name="city">
            <option value="mathura" selected>Mathura</option>
            <option value="agra">Agra</option>
            <option value="lucknow">Lucknow</option>
            <option value="varanasi">Varanasi</option>
        </select>

        <br>

        <label for="place">Favorite Tourist Place:</label>

        <select id="place" name="place">
            <option value="tajmahal" selected>Taj Mahal</option>
            <option value="redfort">Red Fort</option>
            <option value="gateway">Gateway of India</option>
            <option value="hawa">Hawa Mahal</option>
        </select>

    </form>

    <p>
        My selected country is India, state is Uttar Pradesh,
        city is Mathura, and favorite tourist place is Taj Mahal.
    </p>

</body>
</html>
