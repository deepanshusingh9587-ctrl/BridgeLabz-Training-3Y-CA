<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        .gallery img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            margin: 8px;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            width: 500px;
            max-width: 80%;
        }
    </style>
</head>

<body>

    <h2>Image Gallery</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/10/300/200">
        <img src="https://picsum.photos/id/20/300/200">
        <img src="https://picsum.photos/id/30/300/200">
        <img src="https://picsum.photos/id/40/300/200">
        <img src="https://picsum.photos/id/50/300/200">
        <img src="https://picsum.photos/id/60/300/200">
    </div>

    <div id="modal">
        <img id="largeImage">
    </div>

    <script src="Q5_ImageGallery.js"></script>
</body>
</html>
