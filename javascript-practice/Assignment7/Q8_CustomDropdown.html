<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>

    <style>
        #options {
            display: none;
            border: 1px solid black;
            width: 150px;
        }

        .option {
            padding: 8px;
            cursor: pointer;
        }

        .option:hover {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h2>Custom Dropdown</h2>

    <button id="dropdownButton">Select Option</button>

    <div id="options">
        <div class="option">JavaScript</div>
        <div class="option">Java</div>
        <div class="option">Python</div>
    </div>

    <script src="Q8_CustomDropdown.js"></script>
</body>
</html>
