
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Object Updater</title>
</head>
<body>
    <h2>Update User Details</h2>

    <form id="userForm">
        <input id="name" placeholder="Name" value="John">
        <input id="email" type="email" placeholder="Email" value="john@mail.com">
        <input id="age" type="number" placeholder="Age" value="21">
        <button type="submit">Update User</button>
    </form>

    <h3>Updated User Object</h3>
    <pre id="userDetails"></pre>

    <script src="Q8_DynamicObjectUpdater.js"></script>
</body>
</html>
