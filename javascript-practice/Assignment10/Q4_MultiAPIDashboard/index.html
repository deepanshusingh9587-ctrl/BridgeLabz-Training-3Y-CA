<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q4 - Multi-API Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    .grid { display: flex; gap: 40px; margin-top: 20px; }
    .box { flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 6px; }
    #statusBanner { font-weight: bold; color: #0056b3; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Multi-API Dashboard</h2>
  <p id="statusBanner">Loading...</p>
  <button id="reloadBtn">Refresh Data</button>

  <div class="grid">
    <div class="box">
      <h3>Local Projects (Port 3004)</h3>
      <ul id="localList"></ul>
    </div>
    <div class="box">
      <h3>External Posts (JSONPlaceholder)</h3>
      <ul id="externalList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
