<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Company Landing Page</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Company_Landing_Page.css">
</head>

<body>

    <header>

        <!-- Bootstrap navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="#">TechNova</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>

    </header>

    <main>

        <section class="hero py-5">

            <!-- container, row and col used for layout -->
            <div class="container">

                <div class="row align-items-center">

                    <div class="col-md-8">

                        <h1 class="display-4 fw-bold">
                            Build Better Digital Products
                        </h1>

                        <p class="lead">
                            We help businesses create simple, useful and
                            modern digital solutions.
                        </p>

                        <a href="#" class="btn btn-primary">
                            Get Started
                        </a>

                    </div>

                    <div class="col-md-4 text-center">
                        <img src="https://picsum.photos/400/300"
                            class="img-fluid rounded"
                            alt="Technology">
                    </div>

                </div>

            </div>

        </section>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">© 2026 TechNova</p>
    </footer>

</body>

</html>
