<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Personal_Portfolio_Basics.css">
</head>

<body class="bg-light text-dark">

    <header class="text-center mt-4 mb-3">

        <div class="container">

            <h1 class="fw-bold">Rahul Sharma</h1>

            <p class="mb-0">
                Web Developer | UI Enthusiast
            </p>

        </div>

    </header>

    <main>

        <section class="container text-center py-4">

            <!-- Bootstrap responsive image and rounded-circle -->
            <img src="https://picsum.photos/id/1005/250/250"
                class="img-fluid rounded-circle profile-img"
                alt="Profile Image">

            <h2 class="mt-4">About Me</h2>

            <p class="mb-4">
                I enjoy creating clean and user-friendly websites using
                modern web technologies.
            </p>

            <div class="mb-4">
                <button class="btn btn-primary me-2">
                    Hire Me
                </button>

                <button class="btn btn-outline-dark">
                    Download CV
                </button>
            </div>

            <div class="contact-form mx-auto">

                <h3 class="mb-3">Contact Me</h3>

                <input type="text"
                    class="form-control mb-3"
                    placeholder="Your Name">

                <input type="email"
                    class="form-control mb-3"
                    placeholder="Your Email">

                <textarea class="form-control mb-3"
                    rows="4"
                    placeholder="Your Message"></textarea>

                <button class="btn btn-success">
                    Send Message
                </button>

            </div>

        </section>

    </main>

    <footer class="text-center p-3">
        <p class="mb-0">Thank you for visiting my portfolio.</p>
    </footer>

</body>

</html>
