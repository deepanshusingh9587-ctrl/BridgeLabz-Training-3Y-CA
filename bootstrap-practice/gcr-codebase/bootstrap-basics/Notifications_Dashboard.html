<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Notifications_Dashboard.css">
</head>

<body>

    <header class="bg-dark text-white p-4">
        <div class="container">
            <h1>Notifications</h1>
        </div>
    </header>

    <main>

        <section class="container py-5">

            <div class="card">

                <div class="card-body">

                    <h2 class="h4 mb-4">
                        Recent Alerts
                    </h2>

                    <!-- Success alert -->
                    <div class="alert alert-success">
                        Your profile was updated successfully.
                    </div>

                    <!-- Info alert -->
                    <div class="alert alert-info">
                        You have a new message from your team.
                    </div>

                    <!-- Danger alert -->
                    <div class="alert alert-danger">
                        Your password will expire soon.
                    </div>

                    <!-- Dismissible alert -->
                    <div class="alert alert-warning alert-dismissible fade show"
                        role="alert">

                        Please complete your account setup.

                        <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                    <!-- Summary well using bg-light -->
                    <div class="bg-light border p-4 mt-4">

                        <h3 class="h5">Summary</h3>

                        <p class="mb-0">
                            You have 4 notifications today.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Bootstrap JS is needed for dismissible alert -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
