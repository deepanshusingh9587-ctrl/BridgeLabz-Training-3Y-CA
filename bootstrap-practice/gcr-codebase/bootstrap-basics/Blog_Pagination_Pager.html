<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Pagination</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Blog_Pagination_Pager.css">
</head>

<body>

    <header class="container text-center py-5">

        <h1>My Blog</h1>

        <p class="lead">
            Latest articles and useful information.
        </p>

    </header>

    <main>

        <section class="container">

            <article class="mb-4">

                <h2>Learning Web Development</h2>

                <p>
                    Web development becomes easier when the basic
                    concepts are understood properly.
                </p>

            </article>

            <!-- Bootstrap pagination -->
            <nav aria-label="Blog pages">

                <ul class="pagination justify-content-center">

                    <li class="page-item">
                        <a class="page-link" href="#">
                            Previous
                        </a>
                    </li>

                    <li class="page-item active">
                        <a class="page-link" href="#">
                            1
                        </a>
                    </li>

                    <li class="page-item">
                        <a class="page-link" href="#">
                            2
                        </a>
                    </li>

                    <li class="page-item">
                        <a class="page-link" href="#">
                            Next
                        </a>
                    </li>

                </ul>

            </nav>

            <!-- Simple pager -->
            <div class="d-flex justify-content-between mt-4">

                <button class="btn btn-outline-secondary">
                    Older Posts
                </button>

                <button class="btn btn-outline-secondary">
                    Newer Posts
                </button>

            </div>

        </section>

    </main>

    <footer class="text-center mt-5 p-3 bg-light">
        <p class="mb-0">My Blog</p>
    </footer>

</body>

</html>
