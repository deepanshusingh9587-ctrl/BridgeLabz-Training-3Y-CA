<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Pricing_Plans.css">
</head>

<body>

    <header class="text-center py-5">

        <h1>Choose Your Plan</h1>

        <p class="text-muted">
            Select a plan that works for you.
        </p>

    </header>

    <main>

        <section class="container pb-5">

            <div class="row g-4">

                <!-- Bootstrap col-md-4 gives three cards -->
                <div class="col-md-4">

                    <div class="card h-100 plan-card">

                        <div class="card-body text-center">

                            <h2 class="h4">Basic</h2>

                            <h3>₹299/month</h3>

                            <ul class="list-unstyled mt-4">
                                <li class="mb-2">5 Projects</li>
                                <li class="mb-2">Basic Support</li>
                                <li class="mb-2">10 GB Storage</li>
                            </ul>

                            <button class="btn btn-outline-primary">
                                Choose Plan
                            </button>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <!-- Pro plan highlighted -->
                    <div class="card h-100 plan-card bg-primary text-white">

                        <div class="card-body text-center">

                            <h2 class="h4">Pro</h2>

                            <h3>₹599/month</h3>

                            <ul class="list-unstyled mt-4">
                                <li class="mb-2">20 Projects</li>
                                <li class="mb-2">Priority Support</li>
                                <li class="mb-2">50 GB Storage</li>
                            </ul>

                            <button class="btn btn-light">
                                Choose Plan
                            </button>

                        </div>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card h-100 plan-card">

                        <div class="card-body text-center">

                            <h2 class="h4">Premium</h2>

                            <h3>₹999/month</h3>

                            <ul class="list-unstyled mt-4">
                                <li class="mb-2">Unlimited Projects</li>
                                <li class="mb-2">24/7 Support</li>
                                <li class="mb-2">100 GB Storage</li>
                            </ul>

                            <button class="btn btn-outline-primary">
                                Choose Plan
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
