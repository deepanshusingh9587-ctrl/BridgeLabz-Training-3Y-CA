<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Product_Catalog.css">
</head>

<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Product Catalog</h1>
        <p class="mb-0">Choose products for your daily needs</p>
    </header>

    <main>

        <section class="container py-5">

            <div class="row g-4">

                <!-- col-md-3 gives four columns on desktop -->
                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100">

                        <img src="https://picsum.photos/id/1/400/250"
                            class="card-img-top"
                            alt="Laptop">

                        <div class="card-body">
                            <h5 class="card-title">Laptop</h5>
                            <p class="card-text">₹55,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </div>

                </div>

                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100">

                        <img src="https://picsum.photos/id/20/400/250"
                            class="card-img-top"
                            alt="Headphones">

                        <div class="card-body">
                            <h5 class="card-title">Headphones</h5>
                            <p class="card-text">₹2,500</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </div>

                </div>

                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100">

                        <img src="https://picsum.photos/id/96/400/250"
                            class="card-img-top"
                            alt="Camera">

                        <div class="card-body">
                            <h5 class="card-title">Camera</h5>
                            <p class="card-text">₹42,000</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </div>

                </div>

                <div class="col-12 col-sm-6 col-md-3">

                    <div class="card product-card h-100">

                        <img src="https://picsum.photos/id/160/400/250"
                            class="card-img-top"
                            alt="Watch">

                        <div class="card-body">
                            <h5 class="card-title">Smart Watch</h5>
                            <p class="card-text">₹4,999</p>

                            <button class="btn btn-primary">
                                Add to Cart
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
