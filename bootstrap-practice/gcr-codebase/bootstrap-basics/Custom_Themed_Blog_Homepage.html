<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="Custom_Themed_Blog_Homepage.css">
</head>

<body>

    <header class="py-4">
        <div class="container">

            <h1 class="fw-bold">
                Tech & Life Blog
            </h1>

            <p class="mb-0">
                Ideas, technology and everyday experiences.
            </p>

        </div>
    </header>

    <main>

        <section class="container py-5">

            <div class="row g-4">

                <div class="col-md-6">

                    <article class="card h-100">

                        <img src="https://picsum.photos/id/180/600/300"
                            class="card-img-top"
                            alt="Technology">

                        <div class="card-body">

                            <h2 class="h4">
                                Getting Started with Web Development
                            </h2>

                            <p>
                                Learn the basics of HTML, CSS and responsive
                                web design in a simple way.
                            </p>

                            <button class="btn btn-primary">
                                Read More
                            </button>

                        </div>

                    </article>

                </div>

                <div class="col-md-6">

                    <article class="card h-100">

                        <img src="https://picsum.photos/id/3/600/300"
                            class="card-img-top"
                            alt="Laptop">

                        <div class="card-body">

                            <h2 class="h4">
                                Simple Ways to Improve Your Coding
                            </h2>

                            <p>
                                A few useful habits can help you write
                                better and cleaner code.
                            </p>

                            <button class="btn btn-primary">
                                Read More
                            </button>

                        </div>

                    </article>

                </div>

            </div>

        </section>

    </main>

    <footer class="text-center py-3">
        <p class="mb-0">© 2026 Tech & Life Blog</p>
    </footer>

</body>

</html>
