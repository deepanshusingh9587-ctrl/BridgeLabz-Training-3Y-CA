<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header>
        <h1>Box-Sizing Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <div class="box default-box">
                <h2>Default</h2>
                <p>
                    This box uses the default content-box sizing.
                    Padding and border are added to the given width.
                </p>
            </div>

            <div class="box border-box">
                <h2>Border Box</h2>
                <p>
                    This box uses border-box sizing.
                    Padding and border are included in the given width.
                </p>
            </div>

        </section>
    </main>

    <footer>
        <p>Box-Sizing Practice</p>
    </footer>

</body>
</html>
