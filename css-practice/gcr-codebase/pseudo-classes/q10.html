<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header>
        <h1>My Mini UI</h1>
    </header>

    <main>
        <section class="card">

            <img src="https://picsum.photos/200/120" alt="Small image">

            <div class="content">
                <h2>Welcome</h2>
                <p>Fill the form and choose an option.</p>

                <form>
                    <input type="text" placeholder="Enter your name">

                    <select>
                        <option>Select option</option>
                        <option>Option 1</option>
                        <option>Option 2</option>
                    </select>

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Clear</button>
                    </div>
                </form>
            </div>

        </section>
    </main>

    <footer>
        <p>Mini User Interface Practice</p>
    </footer>

</body>
</html>
