<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Tooltip Demonstration</h1>
    </header>

    <main>
        <section class="tooltips">

            <div class="item">
                <span>Home</span>
                <div class="tooltip">Go to Home</div>
            </div>

            <div class="item">
                <span>Profile</span>
                <div class="tooltip">View Profile</div>
            </div>

            <div class="item">
                <span>Settings</span>
                <div class="tooltip">Open Settings</div>
            </div>

            <div class="item">
                <span>Help</span>
                <div class="tooltip">Get Help</div>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Tooltip Practice</p>
    </footer>

</body>
</html>
