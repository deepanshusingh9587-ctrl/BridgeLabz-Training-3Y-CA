<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <header>
        <h1>Pseudo-Classes</h1>
    </header>

    <main>
        <section class="examples">

            <div class="example">
                <a href="#">Hover Link</a>
                <p>:hover changes the link color.</p>
            </div>

            <div class="example">
                <button>Click Button</button>
                <p>:active changes the button while clicking.</p>
            </div>

            <div class="example">
                <input type="text" placeholder="Click here">
                <p>:focus changes the input when selected.</p>
            </div>

            <div class="example">
                <ul>
                    <li>First item</li>
                    <li>Second item</li>
                    <li>Third item</li>
                </ul>
                <p>:nth-child() selects a list item.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Pseudo-Class Practice</p>
    </footer>

</body>
</html>
