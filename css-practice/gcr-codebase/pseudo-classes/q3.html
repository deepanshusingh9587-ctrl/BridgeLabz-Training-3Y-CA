<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
                </div>
                <figcaption>Nature</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
                </div>
                <figcaption>Friendly Dog</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1035/500/350" alt="River">
                </div>
                <figcaption>River View</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1043/500/350" alt="Forest">
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1069/500/350" alt="Beach">
                </div>
                <figcaption>Beach View</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>Image Showcase Practice</p>
    </footer>

</body>
</html>
