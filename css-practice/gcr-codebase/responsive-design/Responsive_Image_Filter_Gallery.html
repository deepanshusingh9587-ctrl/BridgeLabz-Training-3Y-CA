<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>

<body>

    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                <figcaption>Blur</figcaption>
            </figure>

            <figure>
                <img class="gray" src="https://picsum.photos/id/1025/500/350" alt="Dog">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/id/1035/500/350" alt="Nature">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure>
                <img class="bright" src="https://picsum.photos/id/1043/500/350" alt="Forest">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/id/1050/500/350" alt="River">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/id/1069/500/350" alt="Beach">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>

</body>

</html>
