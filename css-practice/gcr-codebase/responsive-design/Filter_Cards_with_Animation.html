<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>

<body>

    <main>

        <section class="profiles">

            <article class="profile-card">

                <img class="gray"
                    src="https://picsum.photos/id/1005/400/300"
                    alt="Profile">

                <div>
                    <h2>Rahul</h2>
                    <p>Web Developer</p>
                </div>

            </article>

            <article class="profile-card">

                <img class="sepia"
                    src="https://picsum.photos/id/1011/400/300"
                    alt="Profile">

                <div>
                    <h2>Aman</h2>
                    <p>UI Designer</p>
                </div>

            </article>

            <article class="profile-card">

                <img class="gray"
                    src="https://picsum.photos/id/1027/400/300"
                    alt="Profile">

                <div>
                    <h2>Rohit</h2>
                    <p>Software Developer</p>
                </div>

            </article>

        </section>

    </main>

</body>

</html>
