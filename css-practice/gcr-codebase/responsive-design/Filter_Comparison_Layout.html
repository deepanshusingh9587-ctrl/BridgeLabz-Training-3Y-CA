<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Filter_Comparison_Layout.css">
</head>

<body>

    <main>

        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/id/1015/600/400"
                    alt="Original image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure>
                <img class="filtered"
                    src="https://picsum.photos/id/1015/600/400"
                    alt="Filtered image">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>

    </main>

</body>

</html>
