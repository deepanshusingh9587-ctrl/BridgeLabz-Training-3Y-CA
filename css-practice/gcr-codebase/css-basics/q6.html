<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Photo Gallery</title>

    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <h1>My Photo Gallery</h1>


    <div class="gallery">


        <!-- Image 1 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                alt="Nature">

            <div class="caption">
                Beautiful Nature
            </div>

        </div>


        <!-- Image 2 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                alt="Beach">

            <div class="caption">
                Beautiful Beach
            </div>

        </div>


        <!-- Image 3 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                alt="Forest">

            <div class="caption">
                Green Forest
            </div>

        </div>


        <!-- Image 4 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                alt="Mountains">

            <div class="caption">
                Amazing Mountains
            </div>

        </div>


        <!-- Image 5 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1494526585095-c41746248156"
                alt="House">

            <div class="caption">
                Beautiful House
            </div>

        </div>


        <!-- Image 6 -->

        <div class="image-box">

            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                alt="Lake">

            <div class="caption">
                Peaceful Lake
            </div>

        </div>


    </div>

</body>

</html>
