<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <link rel="stylesheet" href="q7.css">

</head>


<body>


    <main>


        <form>


            <h1>Contact Us</h1>


            <!-- Name -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name">


            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email">


            <!-- Subject -->

            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                placeholder="Enter subject">


            <!-- Message -->

            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                rows="5"
                placeholder="Write your message">
            </textarea>


            <!-- Submit Button -->

            <button type="submit">

                Send Message

            </button>


        </form>


    </main>


</body>

</html>
