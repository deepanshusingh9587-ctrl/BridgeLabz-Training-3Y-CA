<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="q8.css">

</head>


<body>


    <!-- Fixed Header -->

    <header>

        <h1>My Dashboard</h1>

    </header>


    <!-- Main Layout -->

    <div class="layout">


        <!-- Sidebar -->

        <aside>

            <h2>Menu</h2>

            <a href="#">Home</a>

            <a href="#">Profile</a>

            <a href="#">Projects</a>

            <a href="#">Settings</a>

        </aside>


        <!-- Main Content -->

        <main>


            <div class="box">

                <h2>Welcome</h2>

                <p>
                    This is the main content
                    area of the dashboard.
                </p>

            </div>


            <div class="box">

                <h2>Recent Activity</h2>

                <p>
                    Your latest updates and
                    project information appear here.
                </p>

            </div>


            <div class="box">

                <h2>Statistics</h2>

                <p>
                    Dashboard statistics and
                    information appear here.
                </p>

            </div>


        </main>


    </div>


</body>

</html>
