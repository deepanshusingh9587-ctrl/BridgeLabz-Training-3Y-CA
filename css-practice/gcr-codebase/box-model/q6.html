<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <header>
        <h1>CSS Transformations</h1>
        <p>Hover over the boxes to see the transformations.</p>
    </header>

    <main>
        <section class="boxes">

            <div class="box rotate">
                <div>Rotate</div>
                <p>rotate()</p>
            </div>

            <div class="box scale">
                <div>Scale</div>
                <p>scale()</p>
            </div>

            <div class="box translate">
                <div>Translate</div>
                <p>translate()</p>
            </div>

            <div class="box skew">
                <div>Skew</div>
                <p>skew()</p>
            </div>

        </section>
    </main>

    <footer>
        <p>CSS Transformation Practice</p>
    </footer>

</body>
</html>
