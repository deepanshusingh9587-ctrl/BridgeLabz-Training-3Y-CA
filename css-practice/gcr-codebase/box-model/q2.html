<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <header>
        <h1>Height and Width Practice</h1>
        <p>Different sizes using CSS height and width properties</p>
    </header>

    <main>
        <section class="boxes">

            <div class="box box-one">
                <h2>Box 1</h2>
                <p>Width: 30% and Height: 150px</p>
            </div>

            <div class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 25vw and Height: 20vh</p>
            </div>

            <div class="box box-three">
                <h2>Box 3</h2>
                <p>Width: 18em and Height: 180px</p>
                <p class="extra">This text shows the overflow property.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>Height and Width Practice Page</p>
    </footer>

</body>
</html>
